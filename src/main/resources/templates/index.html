<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manifest Viewer</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .card { background: #fff; border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.1); padding: 2.5rem; width: 100%; max-width: 440px; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #1a1a1a; }
        p.subtitle { color: #666; margin-bottom: 1.5rem; font-size: 0.9rem; }
        .error { background: #fef2f2; border: 1px solid #fca5a5; color: #b91c1c; border-radius: 6px; padding: 0.75rem 1rem; margin-bottom: 1rem; font-size: 0.875rem; }
        label.file-label { display: block; border: 2px dashed #d1d5db; border-radius: 8px; padding: 2rem; text-align: center; cursor: pointer; color: #6b7280; transition: border-color .2s; }
        label.file-label:hover { border-color: #3b82f6; color: #3b82f6; }
        input[type="file"] { display: none; }
        #file-name { margin-top: 1rem; font-size: 0.85rem; color: #374151; text-align: center; min-height: 1.2rem; }
        button { margin-top: 1.25rem; width: 100%; padding: 0.75rem; background: #3b82f6; color: #fff; border: none; border-radius: 8px; font-size: 1rem; cursor: pointer; transition: background .2s; }
        button:hover { background: #2563eb; }
    </style>
</head>
<body>
<div class="card">
    <h1>Manifest Viewer</h1>
    <p class="subtitle">Upload an Excel (.xlsx) file to view its contents.</p>

    <div th:if="${error}" class="error" th:text="${error}"></div>

    <form method="post" action="/upload" enctype="multipart/form-data">
        <label class="file-label" for="file">
            <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16" style="margin-bottom:.5rem">
                <path d="M.5 9.9a.5.5 0 0 1 .5.5v2.5a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2.5a.5.5 0 0 1 1 0v2.5a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2v-2.5a.5.5 0 0 1 .5-.5"/>
                <path d="M7.646 1.146a.5.5 0 0 1 .708 0l3 3a.5.5 0 0 1-.708.708L8.5 2.707V11.5a.5.5 0 0 1-1 0V2.707L5.354 4.854a.5.5 0 1 1-.708-.708z"/>
            </svg>
            <div>Click to choose a file</div>
            <div style="font-size:.75rem;margin-top:.25rem">.xlsx only</div>
        </label>
        <input type="file" id="file" name="file" accept=".xlsx"
               onchange="document.getElementById('file-name').textContent = this.files[0]?.name ?? ''">
        <div id="file-name"></div>
        <button type="submit">Upload &amp; View</button>
    </form>
</div>
</body>
</html>
